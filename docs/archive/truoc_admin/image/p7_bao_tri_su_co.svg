<text x="950.0" y="65.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#1e293b">P7: BẢO TRÌ VÀ SỰ CỐ</text>
<text x="915.0" y="519.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">P7: Bảo trì và sự cố</text>
<text x="175.0" y="259.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Chủ trọ</text>
<text x="535.0" y="192.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">YC xem, theo dõi bảo trì</text>
<text x="535.0" y="272.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT sự cố, trạng thái xử lý</text>
<text x="175.0" y="519.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Quản lý</text>
<text x="535.0" y="452.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT xử lý, cập nhật trạng thái</text>
<text x="535.0" y="532.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT sự cố, TT bảo trì</text>
<text x="175.0" y="779.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Khách thuê</text>
<text x="535.0" y="712.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT sự cố, YC bảo trì</text>
<text x="535.0" y="792.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Trạng thái, KQ xử lý</text>
<text x="1685.0" y="249.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">D7: Bảo trì và sự cố</text>
<text x="1295.0" y="182.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Dữ liệu sự cố, trạng thái xử lý</text>
<text x="1295.0" y="262.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT sự cố, bảo trì cập nhật</text>
<text x="1685.0" y="519.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">D2: Dữ liệu phòng</text>
<text x="1295.0" y="492.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT phòng</text>
<text x="950.0" y="990.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">Xanh trời: tác nhân  •  Xanh lá: tiến trình  •  Tím: kho dữ liệu  •  Mũi tên: chiều dữ liệu</text>
<text x="950.0" y="1027.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Luồng tiến trình chính — không phải sơ đồ phân rã mức 2. Các mã lặp lại biểu diễn cùng tác nhân/tiến trình/kho.</text>
</svg>