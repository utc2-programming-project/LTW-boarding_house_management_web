<text x="950.0" y="65.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#1e293b">P1: TÀI KHOẢN VÀ PHÂN QUYỀN</text>
<text x="915.0" y="504.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">P1: Tài khoản và</text>
<text x="915.0" y="534.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">phân quyền</text>
<text x="175.0" y="259.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Chủ trọ</text>
<text x="535.0" y="165.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT đăng nhập, tài khoản; YC phân</text>
<text x="535.0" y="192.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">quyền</text>
<text x="535.0" y="245.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">KQ xác thực, quản lý tài khoản</text>
<text x="535.0" y="272.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">và phân quyền</text>
<text x="175.0" y="519.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Quản lý</text>
<text x="535.0" y="452.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT đăng nhập, TT cá nhân</text>
<text x="535.0" y="532.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">KQ xác thực, TT tài khoản</text>
<text x="175.0" y="779.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Khách thuê</text>
<text x="535.0" y="712.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT đăng nhập, TT cá nhân</text>
<text x="535.0" y="792.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">KQ xác thực, TT tài khoản</text>
<text x="1685.0" y="504.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">D1: Tài khoản và</text>
<text x="1685.0" y="534.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">phân quyền</text>
<text x="1295.0" y="452.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Dữ liệu tài khoản, quyền</text>
<text x="1295.0" y="532.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT tài khoản, quyền cập nhật</text>
<text x="950.0" y="990.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">Xanh trời: tác nhân  •  Xanh lá: tiến trình  •  Tím: kho dữ liệu  •  Mũi tên: chiều dữ liệu</text>
<text x="950.0" y="1027.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Luồng tiến trình chính — không phải sơ đồ phân rã mức 2. Các mã lặp lại biểu diễn cùng tác nhân/tiến trình/kho.</text>
