<text x="950" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#1e293b">P1: TÀI KHOẢN VÀ PHÂN QUYỀN</text>
<text x="915.0" y="504.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">P1: Tài khoản và</text>
<text x="915.0" y="534.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">phân quyền</text>
<text x="175.0" y="434.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Chủ trọ</text>
<text x="535.0" y="340.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT đăng nhập, tài khoản Quản lý/Khách;</text>
<text x="535.0" y="367.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">YC công tắc, YC duyệt tài khoản</text>
<text x="535.0" y="420.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">KQ xác thực, KQ quản lý tài khoản,</text>
<text x="535.0" y="447.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">YC chờ duyệt</text>
<text x="175.0" y="634.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Quản lý</text>
<text x="535.0" y="540.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT đăng nhập, TT cá nhân,</text>
<text x="535.0" y="567.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT tạo tài khoản Khách thuê</text>
<text x="535.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">KQ xác thực, TT tài khoản,</text>
<text x="535.0" y="647.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">công tắc áp dụng, KQ duyệt</text>
<text x="175.0" y="834.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Khách thuê</text>
<text x="535.0" y="767.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT đăng nhập, TT cá nhân</text>
<text x="535.0" y="847.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">KQ xác thực, TT tài khoản</text>
<text x="1685.0" y="504.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">D1: Tài khoản và</text>
<text x="1685.0" y="534.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">phân quyền</text>
<text x="1295.0" y="452.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Dữ liệu tài khoản, quyền, công tắc</text>
<text x="1295.0" y="532.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT tài khoản, quyền, công tắc cập nhật</text>
<text x="950" y="990" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">Xanh trời: tác nhân  •  Xanh lá: tiến trình  •  Tím: kho dữ liệu  •  Mũi tên: chiều dữ liệu</text>
<text x="950" y="1027" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Luồng tiến trình chính — không phải sơ đồ phân rã mức 2. Các mã lặp lại biểu diễn cùng tác nhân/tiến trình/kho.</text>
<text x="175.0" y="234.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Admin</text>
<text x="535.0" y="167.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TT đăng nhập; YC quản lý tài khoản, cấp/đổi vai trò</text>
<text x="535.0" y="247.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">KQ xác thực, KQ quản lý tài khoản và vai trò</text>
</svg>
