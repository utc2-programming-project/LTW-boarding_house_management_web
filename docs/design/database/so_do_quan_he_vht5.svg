<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 960" width="1580" height="960" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12"><rect width="1580" height="960" fill="#ffffff"/><polyline points="420,79 510,79 510,145 600,145" stroke="#8c959f" stroke-width="1.5" fill="none"/><text x="436" y="68" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2328">1</text><text x="584" y="134" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2328">N</text><text x="510" y="71" text-anchor="middle" font-size="11" fill="#656d76">OwnerId - Restrict</text><polyline points="980,79 1070,79 1070,101 1160,101" stroke="#8c959f" stroke-width="1.5" fill="none"/><text x="996" y="68" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2328">1</text><text x="1144" y="90" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2328">N</text><text x="1070" y="71" text-anchor="middle" font-size="11" fill="#656d76">PropertyId - Restrict</text><line x1="230" y1="398" x2="230" y2="470" stroke="#8c959f" stroke-width="1.5" fill="none"/><text x="241" y="414" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2328">1</text><text x="241" y="454" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2328">N</text><text x="264" y="438" text-anchor="start" font-size="11" fill="#656d76">UserId - Restrict (có thể trống)</text><rect x="40" y="40" width="380" height="358" rx="6" fill="#ffffff" stroke="#8c959f"/><path d="M40 68V46a6 6 0 0 1 6-6H414a6 6 0 0 1 6 6V68Z" fill="#dbe7fb"/><text x="50" y="59" font-size="14" font-weight="700" fill="#1f2328">AspNetUsers (ApplicationUser)</text><line x1="40" y1="68" x2="420" y2="68" stroke="#8c959f" opacity=".35"/><text x="48" y="83" font-size="10" font-weight="700" fill="#b45309">PK</text><text x="74" y="83" fill="#1f2328" font-weight="700">Id</text><text x="235" y="83" fill="#656d76">nvarchar(450)</text><text x="410" y="83" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="90" x2="420" y2="90" stroke="#8c959f" opacity=".35"/><text x="74" y="105" fill="#1f2328">UserName</text><text x="235" y="105" fill="#656d76">nvarchar(256)</text><text x="410" y="105" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="112" x2="420" y2="112" stroke="#8c959f" opacity=".35"/><text x="48" y="127" font-size="10" font-weight="700" fill="#15803d">UQ</text><text x="74" y="127" fill="#1f2328">NormalizedUserName</text><text x="235" y="127" fill="#656d76">nvarchar(256)</text><text x="410" y="127" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="134" x2="420" y2="134" stroke="#8c959f" opacity=".35"/><text x="74" y="149" fill="#1f2328">Email</text><text x="235" y="149" fill="#656d76">nvarchar(256)</text><text x="410" y="149" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="156" x2="420" y2="156" stroke="#8c959f" opacity=".35"/><text x="74" y="171" fill="#1f2328">NormalizedEmail</text><text x="235" y="171" fill="#656d76">nvarchar(256)</text><text x="410" y="171" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="178" x2="420" y2="178" stroke="#8c959f" opacity=".35"/><text x="74" y="193" fill="#1f2328">PasswordHash</text><text x="235" y="193" fill="#656d76">nvarchar(max)</text><text x="410" y="193" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="200" x2="420" y2="200" stroke="#8c959f" opacity=".35"/><text x="74" y="215" fill="#1f2328">SecurityStamp</text><text x="235" y="215" fill="#656d76">nvarchar(max)</text><text x="410" y="215" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="222" x2="420" y2="222" stroke="#8c959f" opacity=".35"/><text x="74" y="237" fill="#1f2328">ConcurrencyStamp</text><text x="235" y="237" fill="#656d76">nvarchar(max)</text><text x="410" y="237" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="244" x2="420" y2="244" stroke="#8c959f" opacity=".35"/><text x="74" y="259" fill="#1f2328">PhoneNumber</text><text x="235" y="259" fill="#656d76">nvarchar(256)</text><text x="410" y="259" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="266" x2="420" y2="266" stroke="#8c959f" opacity=".35"/><text x="74" y="281" fill="#1f2328">EmailConfirmed</text><text x="235" y="281" fill="#656d76">bit</text><text x="410" y="281" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="288" x2="420" y2="288" stroke="#8c959f" opacity=".35"/><text x="74" y="303" fill="#1f2328">PhoneNumberConfirmed</text><text x="235" y="303" fill="#656d76">bit</text><text x="410" y="303" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="310" x2="420" y2="310" stroke="#8c959f" opacity=".35"/><text x="74" y="325" fill="#1f2328">TwoFactorEnabled</text><text x="235" y="325" fill="#656d76">bit</text><text x="410" y="325" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="332" x2="420" y2="332" stroke="#8c959f" opacity=".35"/><text x="74" y="347" fill="#1f2328">LockoutEnabled</text><text x="235" y="347" fill="#656d76">bit</text><text x="410" y="347" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="354" x2="420" y2="354" stroke="#8c959f" opacity=".35"/><text x="74" y="369" fill="#1f2328">LockoutEnd</text><text x="235" y="369" fill="#656d76">datetimeoffset</text><text x="410" y="369" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="376" x2="420" y2="376" stroke="#8c959f" opacity=".35"/><text x="74" y="391" fill="#1f2328">AccessFailedCount</text><text x="235" y="391" fill="#656d76">int</text><text x="410" y="391" text-anchor="end" fill="#656d76">NOT NULL</text><rect x="40" y="40" width="380" height="358" rx="6" fill="none" stroke="#8c959f"/><rect x="600" y="40" width="380" height="204" rx="6" fill="#ffffff" stroke="#8c959f"/><path d="M600 68V46a6 6 0 0 1 6-6H974a6 6 0 0 1 6 6V68Z" fill="#dbe7fb"/><text x="610" y="59" font-size="14" font-weight="700" fill="#1f2328">Properties</text><line x1="600" y1="68" x2="980" y2="68" stroke="#8c959f" opacity=".35"/><text x="608" y="83" font-size="10" font-weight="700" fill="#b45309">PK</text><text x="634" y="83" fill="#1f2328" font-weight="700">Id</text><text x="795" y="83" fill="#656d76">int identity</text><text x="970" y="83" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="600" y1="90" x2="980" y2="90" stroke="#8c959f" opacity=".35"/><text x="634" y="105" fill="#1f2328">Name</text><text x="795" y="105" fill="#656d76">nvarchar(200)</text><text x="970" y="105" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="600" y1="112" x2="980" y2="112" stroke="#8c959f" opacity=".35"/><text x="634" y="127" fill="#1f2328">Address</text><text x="795" y="127" fill="#656d76">nvarchar(500)</text><text x="970" y="127" text-anchor="end" fill="#656d76">NULL</text><line x1="600" y1="134" x2="980" y2="134" stroke="#8c959f" opacity=".35"/><text x="608" y="149" font-size="10" font-weight="700" fill="#1d4ed8">FK</text><text x="634" y="149" fill="#1f2328">OwnerId</text><text x="795" y="149" fill="#656d76">nvarchar(450)</text><text x="970" y="149" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="600" y1="156" x2="980" y2="156" stroke="#8c959f" opacity=".35"/><text x="634" y="171" fill="#1f2328">IsActive</text><text x="795" y="171" fill="#656d76">bit</text><text x="970" y="171" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="600" y1="178" x2="980" y2="178" stroke="#8c959f" opacity=".35"/><text x="634" y="193" fill="#1f2328">CreatedAt</text><text x="795" y="193" fill="#656d76">datetime2</text><text x="970" y="193" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="600" y1="200" x2="980" y2="200" stroke="#8c959f" opacity=".35"/><text x="634" y="215" fill="#1f2328">UpdatedAt</text><text x="795" y="215" fill="#656d76">datetime2</text><text x="970" y="215" text-anchor="end" fill="#656d76">NULL</text><line x1="600" y1="222" x2="980" y2="222" stroke="#8c959f" opacity=".35"/><text x="634" y="237" fill="#1f2328">IsDeleted</text><text x="795" y="237" fill="#656d76">bit</text><text x="970" y="237" text-anchor="end" fill="#656d76">NOT NULL</text><rect x="600" y="40" width="380" height="204" rx="6" fill="none" stroke="#8c959f"/><rect x="1160" y="40" width="380" height="270" rx="6" fill="#ffffff" stroke="#8c959f"/><path d="M1160 68V46a6 6 0 0 1 6-6H1534a6 6 0 0 1 6 6V68Z" fill="#dbe7fb"/><text x="1170" y="59" font-size="14" font-weight="700" fill="#1f2328">Rooms</text><line x1="1160" y1="68" x2="1540" y2="68" stroke="#8c959f" opacity=".35"/><text x="1168" y="83" font-size="10" font-weight="700" fill="#b45309">PK</text><text x="1194" y="83" fill="#1f2328" font-weight="700">Id</text><text x="1355" y="83" fill="#656d76">int identity</text><text x="1530" y="83" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="1160" y1="90" x2="1540" y2="90" stroke="#8c959f" opacity=".35"/><text x="1168" y="105" font-size="10" font-weight="700" fill="#1d4ed8">FK</text><text x="1194" y="105" fill="#1f2328">PropertyId</text><text x="1355" y="105" fill="#656d76">int</text><text x="1530" y="105" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="1160" y1="112" x2="1540" y2="112" stroke="#8c959f" opacity=".35"/><text x="1168" y="127" font-size="10" font-weight="700" fill="#15803d">UQ</text><text x="1194" y="127" fill="#1f2328">Code</text><text x="1355" y="127" fill="#656d76">nvarchar(50)</text><text x="1530" y="127" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="1160" y1="134" x2="1540" y2="134" stroke="#8c959f" opacity=".35"/><text x="1194" y="149" fill="#1f2328">Floor</text><text x="1355" y="149" fill="#656d76">int</text><text x="1530" y="149" text-anchor="end" fill="#656d76">NULL</text><line x1="1160" y1="156" x2="1540" y2="156" stroke="#8c959f" opacity=".35"/><text x="1194" y="171" fill="#1f2328">AreaM2</text><text x="1355" y="171" fill="#656d76">decimal(10,2)</text><text x="1530" y="171" text-anchor="end" fill="#656d76">NULL</text><line x1="1160" y1="178" x2="1540" y2="178" stroke="#8c959f" opacity=".35"/><text x="1194" y="193" fill="#1f2328">StandardPrice</text><text x="1355" y="193" fill="#656d76">decimal(18,2)</text><text x="1530" y="193" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="1160" y1="200" x2="1540" y2="200" stroke="#8c959f" opacity=".35"/><text x="1194" y="215" fill="#1f2328">Status</text><text x="1355" y="215" fill="#656d76">int</text><text x="1530" y="215" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="1160" y1="222" x2="1540" y2="222" stroke="#8c959f" opacity=".35"/><text x="1194" y="237" fill="#1f2328">IsActive</text><text x="1355" y="237" fill="#656d76">bit</text><text x="1530" y="237" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="1160" y1="244" x2="1540" y2="244" stroke="#8c959f" opacity=".35"/><text x="1194" y="259" fill="#1f2328">CreatedAt</text><text x="1355" y="259" fill="#656d76">datetime2</text><text x="1530" y="259" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="1160" y1="266" x2="1540" y2="266" stroke="#8c959f" opacity=".35"/><text x="1194" y="281" fill="#1f2328">UpdatedAt</text><text x="1355" y="281" fill="#656d76">datetime2</text><text x="1530" y="281" text-anchor="end" fill="#656d76">NULL</text><line x1="1160" y1="288" x2="1540" y2="288" stroke="#8c959f" opacity=".35"/><text x="1194" y="303" fill="#1f2328">IsDeleted</text><text x="1355" y="303" fill="#656d76">bit</text><text x="1530" y="303" text-anchor="end" fill="#656d76">NOT NULL</text><rect x="1160" y="40" width="380" height="270" rx="6" fill="none" stroke="#8c959f"/><rect x="40" y="470" width="380" height="226" rx="6" fill="#ffffff" stroke="#8c959f"/><path d="M40 498V476a6 6 0 0 1 6-6H414a6 6 0 0 1 6 6V498Z" fill="#dbe7fb"/><text x="50" y="489" font-size="14" font-weight="700" fill="#1f2328">Tenants</text><line x1="40" y1="498" x2="420" y2="498" stroke="#8c959f" opacity=".35"/><text x="48" y="513" font-size="10" font-weight="700" fill="#b45309">PK</text><text x="74" y="513" fill="#1f2328" font-weight="700">Id</text><text x="235" y="513" fill="#656d76">int identity</text><text x="410" y="513" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="520" x2="420" y2="520" stroke="#8c959f" opacity=".35"/><text x="74" y="535" fill="#1f2328">FullName</text><text x="235" y="535" fill="#656d76">nvarchar(200)</text><text x="410" y="535" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="542" x2="420" y2="542" stroke="#8c959f" opacity=".35"/><text x="74" y="557" fill="#1f2328">Phone</text><text x="235" y="557" fill="#656d76">nvarchar(20)</text><text x="410" y="557" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="564" x2="420" y2="564" stroke="#8c959f" opacity=".35"/><text x="74" y="579" fill="#1f2328">Email</text><text x="235" y="579" fill="#656d76">nvarchar(256)</text><text x="410" y="579" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="586" x2="420" y2="586" stroke="#8c959f" opacity=".35"/><text x="48" y="601" font-size="10" font-weight="700" fill="#15803d">UQ</text><text x="74" y="601" fill="#1f2328">CitizenId</text><text x="235" y="601" fill="#656d76">nvarchar(20)</text><text x="410" y="601" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="608" x2="420" y2="608" stroke="#8c959f" opacity=".35"/><text x="48" y="623" font-size="10" font-weight="700" fill="#1d4ed8">FK</text><text x="74" y="623" fill="#1f2328">UserId</text><text x="235" y="623" fill="#656d76">nvarchar(450)</text><text x="410" y="623" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="630" x2="420" y2="630" stroke="#8c959f" opacity=".35"/><text x="74" y="645" fill="#1f2328">CreatedAt</text><text x="235" y="645" fill="#656d76">datetime2</text><text x="410" y="645" text-anchor="end" fill="#656d76">NOT NULL</text><line x1="40" y1="652" x2="420" y2="652" stroke="#8c959f" opacity=".35"/><text x="74" y="667" fill="#1f2328">UpdatedAt</text><text x="235" y="667" fill="#656d76">datetime2</text><text x="410" y="667" text-anchor="end" fill="#656d76">NULL</text><line x1="40" y1="674" x2="420" y2="674" stroke="#8c959f" opacity=".35"/><text x="74" y="689" fill="#1f2328">IsDeleted</text><text x="235" y="689" fill="#656d76">bit</text><text x="410" y="689" text-anchor="end" fill="#656d76">NOT NULL</text><rect x="40" y="470" width="380" height="226" rx="6" fill="none" stroke="#8c959f"/><text x="40" y="745" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Cách đọc: số 1 và N ghi ở hai đầu đường nối. 1 = một, N = nhiều (từ 0 trở lên). PK khóa chính, FK khóa ngoại, UQ không được trùng.</text><text x="40" y="763" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Quan hệ: 1 tài khoản (AspNetUsers) có N nhà trọ (Properties); 1 nhà trọ có N phòng (Rooms); 1 tài khoản có N hồ sơ khách (Tenants), hồ sơ khách có thể chưa có tài khoản.</text><text x="40" y="781" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">AspNetUsers: tài khoản đăng nhập (ASP.NET Identity, class ApplicationUser), gồm chủ trọ và khách có tài khoản. Khóa chính: Id.</text><text x="40" y="799" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Properties: nhà trọ. Mỗi nhà thuộc đúng 1 chủ trọ, OwnerId bắt buộc (FK tới AspNetUsers.Id).</text><text x="40" y="817" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Rooms: phòng. Mỗi phòng thuộc đúng 1 nhà trọ, PropertyId bắt buộc (FK tới Properties.Id). Mã phòng (Code) không trùng trong cùng 1 nhà.</text><text x="40" y="835" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Tenants: khách thuê. UserId có thể trống (khách chưa có tài khoản). CitizenId (CCCD) đã nhập thì không được trùng.</text><text x="40" y="853" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">UQ có điều kiện: Rooms (PropertyId, Code) khi IsDeleted = 0; Tenants CitizenId khi NOT NULL và IsDeleted = 0; AspNetUsers NormalizedUserName khi NOT NULL.</text><text x="40" y="871" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Mọi FK là Restrict: cấm xóa thật cha khi còn con, kể cả con đã xóa mềm. IsDeleted = ẩn khỏi app (xóa mềm). Khôi phục phải kiểm tra trùng Code phòng / CCCD.</text><text x="40" y="889" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">CreatedAt/UpdatedAt lưu UTC. IsActive, CreatedAt do app gán (DB không có default). Status phòng: 0 Available, 1 Rented, 2 Maintenance.</text><text x="40" y="907" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Chưa có quan hệ Rooms-Tenants (chờ mô hình Hợp đồng). Tenants.UserId không unique: 1 tài khoản có thể có nhiều hồ sơ, cần Đào/Phát xác nhận.</text><text x="40" y="925" font-family="system-ui,sans-serif" font-size="12" fill="#656d76">Các bảng Identity phụ (Roles, UserRoles, Claims, Logins, Tokens, Passkeys) nằm ngoài phạm vi VHT-5.</text></svg>