name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore NhaTro/NhaTro.slnx
      - run: dotnet build NhaTro/NhaTro.slnx --no-restore --nologo
      - run: dotnet test NhaTro/NhaTro.slnx --no-build --nologo
